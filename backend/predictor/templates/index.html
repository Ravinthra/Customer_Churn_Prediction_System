{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Churn Prediction System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4">
                    📊 Customer Churn Prediction
                </h3>

                <!-- Prediction Form -->
                <form id="churnForm">

                    <div class="mb-3">
                        <label class="form-label">Tenure (months)</label>
                        <input
                            type="number"
                            id="tenure"
                            class="form-control"
                            placeholder="e.g. 12"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Monthly Charges</label>
                        <input
                            type="number"
                            step="0.01"
                            id="monthlyCharges"
                            class="form-control"
                            placeholder="e.g. 75.50"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Charges</label>
                        <input
                            type="number"
                            step="0.01"
                            id="totalCharges"
                            class="form-control"
                            placeholder="e.g. 900.00"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contract Type</label>
                        <select
                            id="contract"
                            class="form-select"
                            required
                        >
                            <option value="">Select</option>
                            <option value="0">Month-to-month</option>
                            <option value="1">One year</option>
                            <option value="2">Two year</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select
                            id="paymentMethod"
                            class="form-select"
                            required
                        >
                            <option value="">Select</option>
                            <option value="0">Electronic check</option>
                            <option value="1">Mailed check</option>
                            <option value="2">Bank transfer</option>
                            <option value="3">Credit card</option>
                        </select>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Predict Churn
                    </button>
                </form>

                <!-- Result Section -->
                <div
                    id="result"
                    class="alert mt-4 d-none"
                ></div>

                <!-- Confidence Progress Bar -->
                <div class="progress mt-2">
                    <div
                        id="confidenceBar"
                        class="progress-bar"
                        role="progressbar"
                        style="width: 0%"
                    ></div>
                </div>

            </div>

            <!-- Footer -->
            <p class="text-center text-muted mt-3">
                ML-powered churn prediction using Django & Scikit-learn
            </p>

        </div>
    </div>
</div>

<!-- JavaScript -->
<script src="{% static 'app.js' %}"></script>

</body>
</html>
